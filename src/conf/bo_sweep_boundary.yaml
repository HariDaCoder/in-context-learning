# Edit k/rho/SNR after the coarse phase scan. This focused protocol enables
# the expensive independent fit/holdout probes and uses five evaluation seeds.
n_dims: [20]
context_lengths: [18, 19, 20, 21, 22]
rhos: [0.0, 0.6, 0.9]
snrs: [0.8, 1.6, 3.2, 6.4, 12.8]
eval_seeds: [1001, 1002, 1003, 1004, 1005]
n_eval: 64
batch_size: 32
n_queries: 64
n_probe_queries: 40
n_probe_test_queries: 64
linear_probe: true
query_batch_size: 256
fit_threshold: 0.0001
gen_threshold: 0.1
linearity_threshold: 0.99
baselines: [ols, gls]
feature_rho_after: null
feature_change_point: null
noise_rho: 0.0
noise_rho_after: null
noise_change_point: null
