inherit:
  - benign_harmful_dynamics.yaml
  - wandb.yaml

model:
  family: gpt2
  n_dims: 20
  n_embd: 64
  n_head: 2
  n_layer: 2
  n_positions: 101

training:
  # Markov non-IID data generation
  data: markov
  data_kwargs:
    noise_std: 1.0        # Input noise variance sigma_x
    initial_std: 0.0      # Start from x_0 = 0
    markov_mode: stationary
    markov_scale: 0.6
    max_seq_length: 40    # Context length (T)
    seed: 0

  # Markov task with label noise
  task: markov_noisy_linear_regression
  task_kwargs:
    noise_std: 0.5        # Label noise variance sigma_y
    y_noise: 0.5
    seed: 0

  # Fixed context curriculum
  curriculum:
    dims:
      start: 20
      end: 20
      inc: 0
      interval: 1000000
    points:
      start: 40
      end: 40
      inc: 0
      interval: 1000000

  batch_size: 256
  train_steps: 200000
  learning_rate: 0.0001
  log_every_steps: 100
  save_every_steps: 500
  keep_every_steps: 5000

out_dir: ../models/markov_transformer_dynamics

wandb:
  entity: hai-trinh220970-ho-chi-minh-city-university-of-technology
  project: in-context-training
  name: markov-transformer-dynamics
  notes: "2-layer, 2-head, 64-dim GPT-2 model on Markov data. 200k steps."
  log_every_steps: 100
