inherit:
  - models/small.yaml
  - wandb.yaml

model:
  family: gpt2
  n_dims: 20
  n_embd: 128
  n_head: 4
  n_layer: 6
  n_positions: 101

training:
  batch_size: 64
  data: gaussian
  data_kwargs: {}
  task: noisy_linear_regression
  task_kwargs:
    noise_type: normal
    noise_std: 0.31622776601683794  # sqrt(0.1); overwritten by runner
    w_distribution: gaussian
    w_kwargs:
      scale: 1.0
    loss_type: l2
  curriculum:
    dims:
      start: 20
      end: 20
      inc: 1
      interval: 2000
    points:
      start: 41
      end: 41
      inc: 2
      interval: 2000
  learning_rate: 0.0001
  keep_every_steps: 50000
  save_every_steps: 5000
  train_steps: 500001
  num_tasks: null
  num_training_examples: null
  resume_id: null
  seed: null

out_dir: ../models/benign_overfitting_snr

wandb:
  project: in-context-training
  name: benign-overfitting-snr
  notes: "SNR sweep for benign-to-harmful overfitting in ICL. Runner varies only Gaussian label-noise variance and seed."
  log_every_steps: 500